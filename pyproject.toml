[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doctor-noshy"
version = "0.1.0"
description = "Health monitor and auto-healer for Hermes Agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "psutil>=5.9.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dashboard = ["flask>=3.0.0"]

[project.scripts]
doctor = "doctor_noshy.cli:main"

[tool.setuptools.packages.find]
include = ["doctor_noshy*"]
